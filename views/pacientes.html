<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--surface-raised); padding:0; margin:0;">

<div class="page-body">

    <div id="mensagem" class="mensagem"></div>

    <div class="card">
        <div class="card-header">
            <span class="card-title" id="titulo-form">Cadastrar Paciente</span>
        </div>
        <div class="card-body">
            <form id="form-paciente">
                <input type="hidden" id="id_paciente">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" required maxlength="150" placeholder="Nome completo do paciente">
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
                    </div>
                    <div class="form-group">
                        <label for="data_nascimento">Data de Nascimento</label>
                        <input type="date" id="data_nascimento">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" maxlength="100" placeholder="contato@email.com.br">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btn-salvar">Cadastrar Paciente</button>
                    <button type="button" class="btn btn-secondary" id="btn-cancelar" style="display:none">Cancelar Edição</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-section">
        <div class="table-section-header">
            <span class="table-section-title">Pacientes Cadastrados</span>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Nascimento</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
const API_URL = '../api/pacientes.php';
const form = document.getElementById('form-paciente');
const campoId = document.getElementById('id_paciente');
const campoNome = document.getElementById('nome');
const campoCpf = document.getElementById('cpf');
const campoDataNasc = document.getElementById('data_nascimento');
const campoTelefone = document.getElementById('telefone');
const campoEmail = document.getElementById('email');
const btnCancelar = document.getElementById('btn-cancelar');
const corpoTabela = document.getElementById('corpo-tabela');
const mensagem = document.getElementById('mensagem');
const tituloForm = document.getElementById('titulo-form');

function mostrarMensagem(texto, tipo) {
    mensagem.textContent = texto;
    mensagem.className = 'mensagem ' + tipo;
    clearTimeout(mensagem._t);
    mensagem._t = setTimeout(() => { mensagem.className = 'mensagem'; }, 5000);
}

function formatarData(dt) {
    if (!dt) return '—';
    const p = dt.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
}

async function carregarPacientes() {
    try {
        const res = await fetch(API_URL);
        const resultado = await res.json();
        corpoTabela.innerHTML = '';
        if (!resultado.sucesso) { mostrarMensagem(resultado.erro || 'Erro ao carregar.', 'erro'); return; }
        if (resultado.dados.length === 0) {
            corpoTabela.innerHTML = '<tr><td colspan="7" class="text-muted" style="text-align:center;padding:24px;">Nenhum paciente cadastrado.</td></tr>';
            return;
        }
        resultado.dados.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="tag-id">#${String(p.id_paciente).padStart(4,'0')}</span></td>
                <td><strong>${p.nome}</strong></td>
                <td>${p.cpf || '<span class="text-muted">—</span>'}</td>
                <td>${formatarData(p.data_nascimento)}</td>
                <td>${p.telefone || '<span class="text-muted">—</span>'}</td>
                <td>${p.email || '<span class="text-muted">—</span>'}</td>
                <td>
                    <div class="td-actions">
                        <button class="btn btn-edit btn-sm btn-editar" data-id="${p.id_paciente}">Editar</button>
                        <button class="btn btn-danger btn-sm btn-excluir" data-id="${p.id_paciente}">Excluir</button>
                    </div>
                </td>`;
            corpoTabela.appendChild(tr);
        });
    } catch (e) {
        mostrarMensagem('Erro de conexão.', 'erro');
    }
}

form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const id = campoId.value;
    const payload = { nome: campoNome.value, cpf: campoCpf.value, data_nascimento: campoDataNasc.value, telefone: campoTelefone.value, email: campoEmail.value };
    try {
        const res = await fetch(id ? `${API_URL}?id=${id}` : API_URL, { method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const resultado = await res.json();
        if (!resultado.sucesso) { mostrarMensagem(resultado.erro || 'Erro ao salvar.', 'erro'); return; }
        mostrarMensagem(id ? 'Paciente atualizado.' : 'Paciente cadastrado.', 'sucesso');
        limparFormulario();
        carregarPacientes();
    } catch (e) { mostrarMensagem('Erro de comunicação.', 'erro'); }
});

corpoTabela.addEventListener('click', async (ev) => {
    const target = ev.target.closest('button');
    if (!target) return;
    const id = target.dataset.id;
    if (target.classList.contains('btn-excluir')) {
        if (!confirm('Confirma a exclusão deste paciente?')) return;
        try {
            const res = await fetch(`${API_URL}?id=${id}`, {method:'DELETE'});
            const resultado = await res.json();
            if (!resultado.sucesso) { mostrarMensagem(resultado.erro || 'Erro ao excluir.', 'erro'); return; }
            mostrarMensagem('Paciente excluído.', 'sucesso');
            carregarPacientes();
        } catch (e) { mostrarMensagem('Erro ao excluir.', 'erro'); }
    }
    if (target.classList.contains('btn-editar')) {
        try {
            const res = await fetch(`${API_URL}?id=${id}`);
            const resultado = await res.json();
            if (!resultado.sucesso) return;
            const p = resultado.dados;
            campoId.value = p.id_paciente;
            campoNome.value = p.nome;
            campoCpf.value = p.cpf || '';
            campoDataNasc.value = p.data_nascimento || '';
            campoTelefone.value = p.telefone || '';
            campoEmail.value = p.email || '';
            tituloForm.textContent = `Editar Paciente — ${p.nome}`;
            document.getElementById('btn-salvar').textContent = 'Salvar Alterações';
            btnCancelar.style.display = '';
            window.scrollTo({top:0, behavior:'smooth'});
        } catch (e) { mostrarMensagem('Erro ao carregar paciente.', 'erro'); }
    }
});

btnCancelar.addEventListener('click', limparFormulario);

function limparFormulario() {
    form.reset();
    campoId.value = '';
    tituloForm.textContent = 'Cadastrar Paciente';
    document.getElementById('btn-salvar').textContent = 'Cadastrar Paciente';
    btnCancelar.style.display = 'none';
}

carregarPacientes();
</script>
</body>
</html>
