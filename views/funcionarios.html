<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funcionários</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="topo"></div>

    <h1>Cadastro de funcionários</h1>
    <p id="mensagem"></p>

    <form id="form-funcionario">
        <input type="hidden" id="id_funcionario">

        <div class="linha-form">
            <div><label for="nome">Nome</label><input type="text" id="nome" required maxlength="150"></div>
            <div><label for="cpf">CPF</label><input type="text" id="cpf" required maxlength="14"></div>
            <div><label for="matricula">Matrícula</label><input type="text" id="matricula" required maxlength="20"></div>
            <div><label for="cargo">Cargo</label><input type="text" id="cargo" required maxlength="80"></div>
            <div><label for="telefone">Telefone</label><input type="text" id="telefone" maxlength="20"></div>
            <div><label for="id_setor">Setor</label><select id="id_setor" required></select></div>
            <div><label for="email">E-mail</label><input type="email" id="email" required maxlength="100"></div>
            <div>
                <label for="tipo_usuario">Perfil</label>
                <select id="tipo_usuario" required>
                    <option value="atendente">Atendente</option>
                    <option value="tecnico">Técnico</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <div>
                <label for="senha">Senha <span id="dica-senha"></span></label>
                <input type="password" id="senha" autocomplete="new-password">
            </div>
        </div>

        <button type="submit">Salvar</button>
        <button type="button" id="btn-cancelar" class="secundario" style="display:none">Cancelar edição</button>
    </form>

    <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Matrícula</th><th>Cargo</th><th>Setor</th><th>Perfil</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
    </table>

<script src="../js/app.js"></script>
<script>
const API_URL = '../api/funcionarios.php';
const campos = ['nome', 'cpf', 'matricula', 'cargo', 'telefone', 'id_setor', 'email', 'tipo_usuario', 'senha'];
const campoId = document.getElementById('id_funcionario');
const form = document.getElementById('form-funcionario');
const btnCancelar = document.getElementById('btn-cancelar');

async function carregarSetores() {
    const r = await chamarApi('../api/setores.php');
    preencherSelect(document.getElementById('id_setor'), r.dados, 'id_setor', 'nome_setor');
}

async function carregar() {
    const r = await chamarApi(API_URL);
    const corpo = document.getElementById('corpo-tabela');
    if (!r.sucesso) { mostrarMensagem(r.erro ?? 'Erro ao carregar.', 'erro'); return; }
    corpo.innerHTML = r.dados.map(f => `
        <tr>
            <td>${esc(f.nome)}</td><td>${esc(f.email)}</td><td>${esc(f.matricula)}</td>
            <td>${esc(f.cargo)}</td><td>${esc(f.setor)}</td>
            <td>${esc(ROTULO_PERFIL[f.tipo_usuario])}</td>
            <td class="acoes"><button class="alerta btn-editar" data-id="${esc(f.id_funcionario)}">Editar</button></td>
        </tr>`).join('');
}

function limpar() {
    form.reset();
    campoId.value = '';
    document.getElementById('dica-senha').textContent = '';
    document.getElementById('senha').required = true;
    btnCancelar.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = campoId.value;
    const corpo = {};
    campos.forEach(c => corpo[c] = document.getElementById(c).value);

    const r = await enviarJson(id ? `${API_URL}?id=${id}` : API_URL, id ? 'PUT' : 'POST', corpo);
    if (!r.sucesso) { mostrarMensagem(r.erro ?? 'Erro ao salvar.', 'erro'); return; }

    mostrarMensagem(id ? 'Funcionário atualizado!' : 'Funcionário cadastrado!', 'sucesso');
    limpar();
    carregar();
});

document.getElementById('corpo-tabela').addEventListener('click', async (e) => {
    if (!e.target.classList.contains('btn-editar')) return;
    const r = await chamarApi(`${API_URL}?id=${e.target.dataset.id}`);
    if (!r.sucesso) { mostrarMensagem(r.erro, 'erro'); return; }

    const f = r.dados;
    campoId.value = f.id_funcionario;
    campos.forEach(c => { if (c !== 'senha') document.getElementById(c).value = f[c] ?? ''; });
    document.getElementById('senha').value = '';
    document.getElementById('senha').required = false;
    document.getElementById('dica-senha').textContent = '(deixe em branco para manter a atual)';
    btnCancelar.style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

btnCancelar.addEventListener('click', limpar);

(async () => {
    await iniciarPagina(['admin']);
    await carregarSetores();
    await carregar();
})();
</script>
</body>
</html>
