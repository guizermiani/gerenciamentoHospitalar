<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamados</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="topo"></div>

    <h1>Chamados</h1>
    <p id="mensagem"></p>

    <h2>Abrir novo chamado</h2>
    <form id="form-chamado">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" required maxlength="150">

        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="3" required></textarea>

        <div class="linha-form">
            <div>
                <label for="id_setor">Setor</label>
                <select id="id_setor" required></select>
            </div>
            <div>
                <label for="id_categoria">Categoria</label>
                <select id="id_categoria" required></select>
            </div>
            <div>
                <label for="id_prioridade">Prioridade</label>
                <select id="id_prioridade" required></select>
            </div>
            <div>
                <label for="id_paciente">Paciente (opcional)</label>
                <select id="id_paciente"></select>
            </div>
        </div>

        <button type="submit">Abrir chamado</button>
    </form>

    <h2 id="titulo-lista">Consulta de chamados</h2>
    <form id="form-filtros" class="filtros">
        <div>
            <label for="f-busca">Busca (título, descrição ou nº)</label>
            <input type="text" id="f-busca">
        </div>
        <div>
            <label for="f-status">Status</label>
            <select id="f-status"></select>
        </div>
        <div>
            <label for="f-prioridade">Prioridade</label>
            <select id="f-prioridade"></select>
        </div>
        <div>
            <label for="f-setor">Setor</label>
            <select id="f-setor"></select>
        </div>
        <div id="bloco-meus" style="display:none">
            <label for="f-meus">Responsável</label>
            <select id="f-meus">
                <option value="">Todos</option>
                <option value="1">Somente os meus</option>
            </select>
        </div>
        <div>
            <button type="submit">Filtrar</button>
            <button type="button" id="btn-limpar" class="secundario">Limpar</button>
        </div>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nº</th><th>Título</th><th>Setor</th><th>Prioridade</th><th>Status</th>
                <th>Aberto por</th><th>Responsável</th><th>Abertura</th><th></th>
            </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
    </table>

<script src="../js/app.js"></script>
<script>
const API_CHAMADOS = '../api/chamados.php';
const API_APOIO    = '../api/dados_apoio.php';

let usuarioLogado = null;

async function carregarDadosApoio() {
    const r = await chamarApi(API_APOIO);
    const a = r.dados;

    preencherSelect(document.getElementById('id_setor'), a.setores, 'id_setor', 'nome_setor');
    preencherSelect(document.getElementById('id_categoria'), a.categorias, 'id_categoria', 'nome_categoria');
    preencherSelect(document.getElementById('id_prioridade'), a.prioridades, 'id_prioridade', 'descricao');
    preencherSelect(document.getElementById('id_paciente'), a.pacientes, 'id_paciente', 'nome', 'Nenhum');

    preencherSelect(document.getElementById('f-status'), a.status, 'id_status', 'descricao', 'Todos');
    preencherSelect(document.getElementById('f-prioridade'), a.prioridades, 'id_prioridade', 'descricao', 'Todas');
    preencherSelect(document.getElementById('f-setor'), a.setores, 'id_setor', 'nome_setor', 'Todos');
}

function filtrosAtuais() {
    const p = new URLSearchParams();
    const campos = {
        busca: 'f-busca', id_status: 'f-status', id_prioridade: 'f-prioridade',
        id_setor: 'f-setor', meus: 'f-meus',
    };
    for (const [nome, idCampo] of Object.entries(campos)) {
        const v = document.getElementById(idCampo).value.trim();
        if (v) p.set(nome, v);
    }
    return p.toString();
}

async function carregarChamados() {
    const qs = filtrosAtuais();
    const r = await chamarApi(API_CHAMADOS + (qs ? '?' + qs : ''));
    const corpo = document.getElementById('corpo-tabela');

    if (!r.sucesso) {
        mostrarMensagem(r.erro ?? 'Erro ao carregar chamados.', 'erro');
        return;
    }

    if (r.dados.length === 0) {
        corpo.innerHTML = '<tr><td colspan="9" class="vazio">Nenhum chamado encontrado.</td></tr>';
        return;
    }

    corpo.innerHTML = r.dados.map(c => `
        <tr>
            <td>#${esc(c.id_chamado)}</td>
            <td>${esc(c.titulo)}</td>
            <td>${esc(c.setor)}</td>
            <td><span class="selo prio-${esc(c.id_prioridade)}">${esc(c.prioridade)}</span></td>
            <td><span class="selo status-${esc(c.id_status)}">${esc(c.status)}</span></td>
            <td>${esc(c.aberto_por)}</td>
            <td>${esc(c.responsavel ?? '— sem responsável —')}</td>
            <td>${esc(formatarData(c.data_abertura))}</td>
            <td><a href="chamado.html?id=${esc(c.id_chamado)}">Abrir</a></td>
        </tr>`).join('');
}

document.getElementById('form-chamado').addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const r = await enviarJson(API_CHAMADOS, 'POST', {
        titulo: document.getElementById('titulo').value,
        descricao: document.getElementById('descricao').value,
        id_setor: document.getElementById('id_setor').value,
        id_categoria: document.getElementById('id_categoria').value,
        id_prioridade: document.getElementById('id_prioridade').value,
        id_paciente: document.getElementById('id_paciente').value || null,
    });

    if (!r.sucesso) {
        mostrarMensagem(r.erro ?? 'Erro ao abrir chamado.', 'erro');
        return;
    }

    mostrarMensagem(`Chamado #${r.dados.id_chamado} aberto com sucesso!`, 'sucesso');
    document.getElementById('form-chamado').reset();
    carregarChamados();
});

document.getElementById('form-filtros').addEventListener('submit', (e) => {
    e.preventDefault();
    carregarChamados();
});

document.getElementById('btn-limpar').addEventListener('click', () => {
    document.getElementById('form-filtros').reset();
    carregarChamados();
});

(async () => {
    usuarioLogado = await iniciarPagina();
    if (usuarioLogado.tipo_usuario === 'atendente') {
        document.getElementById('titulo-lista').textContent = 'Meus chamados';
    }
    if (usuarioLogado.tipo_usuario !== 'atendente') {
        document.getElementById('bloco-meus').style.display = 'block';
    }
    await carregarDadosApoio();
    await carregarChamados();
})();
</script>
</body>
</html>
