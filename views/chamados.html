<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Chamados</title>
<link rel = "stylesheet" href="../css/style.css">
</head>
<body>
    <h1>Chamados</h1>
    <p id="mensagem"></p>

    <h2>Abrir novo chamado</h2>
    <form id="form-chamado">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" required maxlength="150">

        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="3" required></textarea>

        <label for="id_setor">Setor</label>
        <select id="id_setor" required></select>

        <label for="id_categoria">Categoria</label>
        <select id="id_categoria" required></select>

        <label for="id_prioridade">Prioridade</label>
        <select id="id_prioridade" required></select>

        <label for="id_funcionario_abertura">Aberto por</label>
        <select id="id_funcionario_abertura" required></select>

        <button type="submit">Abrir chamado</button>
    </form>

    <h2>Chamados</h2>
    <table>
        <thead>
            <tr>
                <th>Título</th><th>Setor</th><th>Prioridade</th>
                <th>Status</th><th>Aberto por</th><th>Responsável</th><th></th>
            </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
    </table>

<script>
const API_CHAMADOS = '../api/chamados.php';
const API_APOIO    = '../api/dados_apoio.php';

let apoio = null; // guarda setores, categorias, prioridades, funcionarios e status já carregados

function mostrarMensagem(texto, tipo) {
    const el = document.getElementById('mensagem');
    el.textContent = texto;
    el.className = tipo;
}

function preencherSelect(select, itens, campoValor, campoTexto) {
    select.innerHTML = itens
        .map(item => `<option value="${item[campoValor]}">${item[campoTexto]}</option>`)
        .join('');
}

// Carrega setores/categorias/prioridades/funcionarios/status uma única vez
async function carregarDadosApoio() {
    const resposta = await fetch(API_APOIO);
    const resultado = await resposta.json();
    apoio = resultado.dados;

    preencherSelect(document.getElementById('id_setor'), apoio.setores, 'id_setor', 'nome_setor');
    preencherSelect(document.getElementById('id_categoria'), apoio.categorias, 'id_categoria', 'nome_categoria');
    preencherSelect(document.getElementById('id_prioridade'), apoio.prioridades, 'id_prioridade', 'descricao');
    preencherSelect(document.getElementById('id_funcionario_abertura'), apoio.funcionarios, 'id_funcionario', 'nome');
}

// Busca os chamados e desenha a tabela, com selects inline de status/responsável
async function carregarChamados() {
    const resposta = await fetch(API_CHAMADOS);
    const resultado = await resposta.json();
    const corpo = document.getElementById('corpo-tabela');
    corpo.innerHTML = '';

    if (!resultado.sucesso) {
        mostrarMensagem(resultado.erro ?? 'Erro ao carregar chamados.', 'erro');
        return;
    }

    resultado.dados.forEach(chamado => {
        const opcoesStatus = apoio.status.map(s =>
            `<option value="${s.id_status}" ${s.id_status == chamado.id_status ? 'selected' : ''}>${s.descricao}</option>`
        ).join('');

        const opcoesResponsavel = apoio.funcionarios.map(f =>
            `<option value="${f.id_funcionario}" ${f.id_funcionario == chamado.id_funcionario_responsavel ? 'selected' : ''}>${f.nome}</option>`
        ).join('');

        const linha = document.createElement('tr');
        linha.innerHTML = `
            <td>${chamado.titulo}</td>
            <td>${chamado.setor}</td>
            <td>${chamado.prioridade}</td>
            <td><select class="select-status">${opcoesStatus}</select></td>
            <td>${chamado.aberto_por}</td>
            <td><select class="select-responsavel">${opcoesResponsavel}</select></td>
            <td><button class="btn-atualizar" data-id="${chamado.id_chamado}">Atualizar</button></td>
        `;
        corpo.appendChild(linha);
    });
}

// Abrir novo chamado
document.getElementById('form-chamado').addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const corpo = JSON.stringify({
        titulo: document.getElementById('titulo').value,
        descricao: document.getElementById('descricao').value,
        id_setor: document.getElementById('id_setor').value,
        id_categoria: document.getElementById('id_categoria').value,
        id_prioridade: document.getElementById('id_prioridade').value,
        id_funcionario_abertura: document.getElementById('id_funcionario_abertura').value,
    });

    const resposta = await fetch(API_CHAMADOS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: corpo,
    });
    const resultado = await resposta.json();

    if (!resultado.sucesso) {
        mostrarMensagem(resultado.erro ?? 'Erro ao abrir chamado.', 'erro');
        return;
    }

    mostrarMensagem('Chamado aberto com sucesso!', 'sucesso');
    document.getElementById('form-chamado').reset();
    carregarChamados();
});

// Atualizar status/responsável (delegado, pois os botões são criados dinamicamente)
document.getElementById('corpo-tabela').addEventListener('click', async (evento) => {
    if (!evento.target.classList.contains('btn-atualizar')) return;

    const id = evento.target.dataset.id;
    const linha = evento.target.closest('tr');
    const idStatus = linha.querySelector('.select-status').value;
    const idResponsavel = linha.querySelector('.select-responsavel').value;

    const resposta = await fetch(`${API_CHAMADOS}?id=${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            id_status: idStatus,
            id_funcionario_responsavel: idResponsavel,
        }),
    });
    const resultado = await resposta.json();

    if (!resultado.sucesso) {
        mostrarMensagem(resultado.erro ?? 'Erro ao atualizar chamado.', 'erro');
        return;
    }

    mostrarMensagem('Chamado atualizado!', 'sucesso');
    carregarChamados();
});

(async () => {
    await carregarDadosApoio(); // precisa vir antes, a tabela usa esses dados nos selects
    await carregarChamados();
})();
</script>
</body>
</html>
