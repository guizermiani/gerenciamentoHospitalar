<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setores</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="topo"></div>

    <h1>Setores do hospital</h1>
    <p id="mensagem"></p>

    <form id="form-setor">
        <input type="hidden" id="id_setor">

        <label for="nome_setor">Nome</label>
        <input type="text" id="nome_setor" required maxlength="100">

        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="2"></textarea>

        <button type="submit">Salvar</button>
        <button type="button" id="btn-cancelar" class="secundario" style="display:none">Cancelar edição</button>
    </form>

    <table>
        <thead><tr><th>Nome</th><th>Descrição</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
    </table>

<script src="../js/app.js"></script>
<script>
const API_URL = '../api/setores.php';
const form = document.getElementById('form-setor');
const campoId = document.getElementById('id_setor');
const btnCancelar = document.getElementById('btn-cancelar');

async function carregar() {
    const r = await chamarApi(API_URL);
    if (!r.sucesso) { mostrarMensagem(r.erro ?? 'Erro ao carregar.', 'erro'); return; }
    document.getElementById('corpo-tabela').innerHTML = r.dados.map(s => `
        <tr>
            <td>${esc(s.nome_setor)}</td><td>${esc(s.descricao ?? '')}</td>
            <td class="acoes"><button class="alerta btn-editar" data-id="${esc(s.id_setor)}">Editar</button></td>
        </tr>`).join('');
}

function limpar() {
    form.reset();
    campoId.value = '';
    btnCancelar.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = campoId.value;
    const r = await enviarJson(id ? `${API_URL}?id=${id}` : API_URL, id ? 'PUT' : 'POST', {
        nome_setor: document.getElementById('nome_setor').value,
        descricao: document.getElementById('descricao').value,
    });
    if (!r.sucesso) { mostrarMensagem(r.erro ?? 'Erro ao salvar.', 'erro'); return; }
    mostrarMensagem(id ? 'Setor atualizado!' : 'Setor criado!', 'sucesso');
    limpar();
    carregar();
});

document.getElementById('corpo-tabela').addEventListener('click', async (e) => {
    if (!e.target.classList.contains('btn-editar')) return;
    const r = await chamarApi(`${API_URL}?id=${e.target.dataset.id}`);
    if (!r.sucesso) return;
    campoId.value = r.dados.id_setor;
    document.getElementById('nome_setor').value = r.dados.nome_setor;
    document.getElementById('descricao').value = r.dados.descricao ?? '';
    btnCancelar.style.display = 'inline-block';
});

btnCancelar.addEventListener('click', limpar);

(async () => {
    await iniciarPagina(['admin']);
    await carregar();
})();
</script>
</body>
</html>
