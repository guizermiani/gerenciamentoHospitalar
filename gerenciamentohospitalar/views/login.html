<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login - Sistema de Chamados</title>
<style>
    body { font-family: Arial, Helvetica, sans-serif; }
    .container { max-width: 360px; margin: 80px auto; background: #f4f6f8; padding: 32px; border-radius: 8px; }
    h1 { font-size: 18px; text-align: center; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 20px; background: #1e5f8c; color: #fff; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
    #mensagem { font-size: 14px; color: #c0392b; text-align: center; }
</style>
</head>
<body>
    <div class="container">
        <h1>Sistema de Chamados - Hospital</h1>
        <p id="mensagem"></p>
        <form id="form-login">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" required>

            <button type="submit">Entrar</button>
        </form>
    </div>

<script>
document.getElementById('form-login').addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const resposta = await fetch('../api/auth.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
        }),
    });
    const resultado = await resposta.json();

    if (!resultado.sucesso) {
        document.getElementById('mensagem').textContent = resultado.erro;
        return;
    }

    window.location.href = 'chamados.html';
});
</script>
</body>
</html>
