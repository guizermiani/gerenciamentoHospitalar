<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhe do chamado</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="topo"></div>

    <p><a href="chamados.html">&larr; Voltar para a lista</a></p>
    <h1 id="titulo-pagina">Chamado</h1>
    <p id="mensagem"></p>

    <div class="cartao" id="dados"></div>

    <div id="bloco-acoes" style="display:none">
        <h2>Atualizar chamado</h2>
        <form id="form-acao">
            <div class="linha-form">
                <div>
                    <label for="novo-status">Status</label>
                    <select id="novo-status"></select>
                </div>
                <div id="bloco-responsavel" style="display:none">
                    <label for="novo-responsavel">Responsável</label>
                    <select id="novo-responsavel"></select>
                </div>
            </div>
            <label for="acao-comentario">Comentário <span id="dica-comentario"></span></label>
            <textarea id="acao-comentario" rows="2"></textarea>
            <button type="submit">Salvar alteração</button>
        </form>
    </div>

    <h2>Andamentos</h2>
    <ul class="linha-tempo" id="andamentos"></ul>

    <div id="bloco-andamento" style="display:none">
        <form id="form-andamento">
            <label for="comentario">Registrar novo andamento</label>
            <textarea id="comentario" rows="3" required></textarea>
            <button type="submit">Registrar andamento</button>
        </form>
    </div>

<script src="../js/app.js"></script>
<script>
const API_CHAMADOS   = '../api/chamados.php';
const API_ANDAMENTOS = '../api/andamentos.php';
const API_APOIO      = '../api/dados_apoio.php';

const idChamado = parseInt(new URLSearchParams(window.location.search).get('id'), 10);
let apoio = null;
let chamado = null;

function desenharDados() {
    document.getElementById('titulo-pagina').textContent = `Chamado #${chamado.id_chamado} — ${chamado.titulo}`;
    document.getElementById('dados').innerHTML = `
        <div class="dados-chamado">
            <div><b>Status</b><span class="selo status-${esc(chamado.id_status)}">${esc(chamado.status)}</span></div>
            <div><b>Prioridade</b><span class="selo prio-${esc(chamado.id_prioridade)}">${esc(chamado.prioridade)}</span></div>
            <div><b>Setor</b>${esc(chamado.setor)}</div>
            <div><b>Categoria</b>${esc(chamado.categoria)}</div>
            <div><b>Aberto por</b>${esc(chamado.aberto_por)}</div>
            <div><b>Responsável</b>${esc(chamado.responsavel ?? '— sem responsável —')}</div>
            <div><b>Paciente</b>${esc(chamado.paciente ?? '—')}</div>
            <div><b>Abertura</b>${esc(formatarData(chamado.data_abertura))}</div>
            <div><b>Fechamento</b>${esc(formatarData(chamado.data_fechamento))}</div>
        </div>
        <div class="descricao-chamado">${esc(chamado.descricao)}</div>`;
}

function desenharAndamentos() {
    const lista = document.getElementById('andamentos');
    if (!chamado.andamentos.length) {
        lista.innerHTML = '<li>Nenhum andamento registrado.</li>';
        return;
    }
    lista.innerHTML = chamado.andamentos.map(a => `
        <li>
            <div class="meta">${esc(formatarData(a.data_hora))} — ${esc(a.funcionario)} (${esc(ROTULO_PERFIL[a.tipo_usuario] ?? a.tipo_usuario)})</div>
            <div class="texto">${esc(a.comentario)}</div>
        </li>`).join('');
}

function desenharAcoes() {
    const acoes = chamado.acoes;

    // Status: o atual + as transições que este usuário pode fazer
    const permitidos = new Set([Number(chamado.id_status), ...acoes.transicoes.map(Number)]);
    const selStatus = document.getElementById('novo-status');
    selStatus.innerHTML = apoio.status
        .filter(s => permitidos.has(Number(s.id_status)))
        .map(s => `<option value="${esc(s.id_status)}" ${s.id_status == chamado.id_status ? 'selected' : ''}>${esc(s.descricao)}</option>`)
        .join('');

    const blocoResp = document.getElementById('bloco-responsavel');
    blocoResp.style.display = acoes.pode_reatribuir ? 'block' : 'none';
    if (acoes.pode_reatribuir) {
        preencherSelect(document.getElementById('novo-responsavel'), apoio.responsaveis, 'id_funcionario', 'nome', '— sem responsável —');
        document.getElementById('novo-responsavel').value = chamado.id_funcionario_responsavel ?? '';
    }

    const temAcao = acoes.transicoes.length > 0 || acoes.pode_reatribuir;
    document.getElementById('bloco-acoes').style.display = temAcao ? 'block' : 'none';
    document.getElementById('dica-comentario').textContent = '(obrigatório para resolver, cancelar ou reabrir)';

    document.getElementById('bloco-andamento').style.display = acoes.pode_comentar ? 'block' : 'none';
}

async function carregarChamado() {
    const r = await chamarApi(`${API_CHAMADOS}?id=${idChamado}`);
    if (!r.sucesso) {
        mostrarMensagem(r.erro ?? 'Erro ao carregar chamado.', 'erro');
        document.getElementById('dados').style.display = 'none';
        return;
    }
    chamado = r.dados;
    desenharDados();
    desenharAndamentos();
    desenharAcoes();
}

document.getElementById('form-acao').addEventListener('submit', async (e) => {
    e.preventDefault();

    const corpo = {
        id_status: document.getElementById('novo-status').value,
        comentario: document.getElementById('acao-comentario').value,
    };
    if (chamado.acoes.pode_reatribuir) {
        corpo.id_funcionario_responsavel = document.getElementById('novo-responsavel').value;
    }

    const r = await enviarJson(`${API_CHAMADOS}?id=${idChamado}`, 'PUT', corpo);
    if (!r.sucesso) {
        mostrarMensagem(r.erro ?? 'Erro ao atualizar chamado.', 'erro');
        return;
    }
    mostrarMensagem('Chamado atualizado!', 'sucesso');
    document.getElementById('acao-comentario').value = '';
    chamado = r.dados;
    desenharDados();
    desenharAndamentos();
    desenharAcoes();
});

document.getElementById('form-andamento').addEventListener('submit', async (e) => {
    e.preventDefault();

    const r = await enviarJson(`${API_ANDAMENTOS}?id_chamado=${idChamado}`, 'POST', {
        comentario: document.getElementById('comentario').value,
    });
    if (!r.sucesso) {
        mostrarMensagem(r.erro ?? 'Erro ao registrar andamento.', 'erro');
        return;
    }
    mostrarMensagem('Andamento registrado!', 'sucesso');
    document.getElementById('comentario').value = '';
    chamado.andamentos = r.dados;
    desenharAndamentos();
});

(async () => {
    await iniciarPagina();
    if (!idChamado) {
        mostrarMensagem('Chamado não informado.', 'erro');
        return;
    }
    const r = await chamarApi(API_APOIO);
    apoio = r.dados;
    await carregarChamado();
})();
</script>
</body>
</html>
